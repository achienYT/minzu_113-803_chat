<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>803 班級系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --line-green: #00B900; --bg-gray: #9bb6e6; --note-orange: #ff9800; --vote-blue: #007bff; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #ececec; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #222e3a; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; position: fixed; top: 0; width: 100%; z-index: 100; }
        #content { flex: 1; margin-top: 55px; margin-bottom: 60px; overflow-y: auto; padding: 10px; background-color: var(--bg-gray); }
        .page { display: none; }
        .page.active { display: block; }

        /* 聊天樣式 */
        .message-row { display: flex; margin-bottom: 15px; align-items: flex-start; }
        .message-row.me { flex-direction: row-reverse; }
        .avatar { width: 45px; height: 45px; background: #fff; border-radius: 50%; text-align: center; line-height: 45px; font-size: 14px; font-weight: bold; color: #333; border: 1px solid #ddd; flex-shrink: 0; }
        .message-row.me .avatar { display: none; }
        .msg-content { max-width: 70%; margin: 0 10px; }
        .bubble { background: white; padding: 10px 14px; border-radius: 15px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-wrap: break-word; }
        .message-row.me .bubble { background: #85ff49; }

        /* 記事本樣式 */
        .note-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 6px solid var(--note-orange); }
        .note-title { font-weight: bold; font-size: 17px; margin-bottom: 5px; color: #333; }
        .note-meta { font-size: 11px; color: #999; margin-top: 10px; border-top: 1px solid #eee; padding-top: 5px; }

        /* 投票樣式 */
        .poll-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; }
        .poll-option { margin: 12px 0; background: #f9f9f9; border: 1px solid #eee; padding: 12px; border-radius: 5px; cursor: pointer; position: relative; overflow: hidden; }
        .poll-bar { position: absolute; left: 0; top: 0; height: 100%; background: rgba(0, 123, 255, 0.2); transition: width 0.8s ease; width: 0%; }
        .poll-text { position: relative; z-index: 1; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        .voted-badge { font-size: 11px; color: var(--vote-blue); font-weight: normal; }

        /* 輸入框 & 導覽列 */
        .input-area { position: fixed; bottom: 60px; width: 100%; background: white; padding: 10px; box-sizing: border-box; display: flex; border-top: 1px solid #ddd; z-index: 99; }
        .input-area input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ddd; outline: none; background: #f5f5f5; }
        .input-area button { background: var(--line-green); color: white; border: none; padding: 0 18px; margin-left: 8px; border-radius: 20px; font-weight: bold; }
        nav { position: fixed; bottom: 0; width: 100%; background: #fdfdfd; border-top: 1px solid #e0e0e0; display: flex; height: 60px; z-index: 100; }
        .nav-item { flex: 1; text-align: center; color: #999; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .nav-item.active { color: #333; font-weight: bold; }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }
        .fab { position: fixed; bottom: 80px; right: 20px; background: var(--line-green); color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 101; }
    </style>
</head>
<body>

    <header id="header-title">803 聊天室</header>

    <div id="content">
        <div id="page-chat" class="page active"><div id="chat-list"></div></div>
        <div id="page-notes" class="page"><div id="notes-list"></div><div class="fab" onclick="addNote()">+</div></div>
        <div id="page-vote" class="page">
            <div class="poll-card">
                <h3 id="poll-question">尚未發起投票</h3>
                <div id="poll-options-container"></div>
                <p id="my-vote-status" style="font-size:12px; color:#666; margin-top:15px; text-align:center;"></p>
            </div>
            <div class="fab" onclick="createNewPoll()">+</div>
        </div>
    </div>

    <div class="input-area" id="input-bar">
        <input type="text" id="msgInput" placeholder="輸入訊息..." autocomplete="off">
        <button onclick="sendChat()">傳送</button>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchPage('chat')"><i class="fas fa-comment"></i>聊天</div>
        <div class="nav-item" onclick="switchPage('notes')"><i class="fas fa-clipboard"></i>記事本</div>
        <div class="nav-item" onclick="switchPage('vote')"><i class="fas fa-poll"></i>投票</div>
    </nav>

    <script>
        const API_URL = "你的_GAS_網址"; 
        const currentUser = localStorage.getItem('chatUser') || "訪客";
        const currentId = localStorage.getItem('chatID') || "guest";

        let pollTitle = "";
        let pollOptions = [];
        let hasVoted = false; // 紀錄當前使用者是否已投票

        window.onload = () => { refreshData(); setInterval(refreshData, 3000); };

        function refreshData() {
            fetch(API_URL).then(res => res.json()).then(data => {
                const chatList = document.getElementById('chat-list');
                const noteList = document.getElementById('notes-list');
                chatList.innerHTML = '';
                noteList.innerHTML = '';

                let voteTracker = {}; // 用來記錄每個 User ID 的最新投票
                hasVoted = false;

                data.forEach(item => {
                    const type = item.type ? item.type.toString().toLowerCase() : "chat";
                    const msg = item.msg || "";

                    if (type === "note") {
                        const parts = msg.split('|');
                        const card = document.createElement('div');
                        card.className = 'note-card';
                        card.innerHTML = `<div class="note-title">${parts[0]}</div><div>${parts[1]||""}</div><div class="note-meta">${item.name} • ${item.time}</div>`;
                        noteList.prepend(card);
                    } 
                    else if (type === "vote_setup") {
                        const parts = msg.split('|');
                        pollTitle = parts[0];
                        pollOptions = parts.slice(1);
                        voteTracker = {}; // 發起新投票時清空舊紀錄
                    }
                    else if (type === "vote_cast") {
                        // 關鍵邏輯：每個人只紀錄「最後一次」投票
                        voteTracker[item.user] = msg;
                        if (item.user === currentId) hasVoted = true;
                    }
                    else {
                        const row = document.createElement('div');
                        const isMe = item.user === currentId;
                        row.className = `message-row ${isMe ? 'me' : ''}`;
                        row.innerHTML = `<div class="avatar">${item.name.substring(0,2)}</div><div class="msg-content"><div class="bubble">${msg}</div></div>`;
                        chatList.appendChild(row);
                    }
                });

                // 統計最終票數
                let counts = {};
                pollOptions.forEach(opt => counts[opt] = 0);
                Object.values(voteTracker).forEach(v => { if(counts.hasOwnProperty(v)) counts[v]++; });

                renderPollUI(counts);
            });
        }

        function renderPollUI(counts) {
            document.getElementById('poll-question').innerText = pollTitle || "點擊 + 發起新投票";
            const container = document.getElementById('poll-options-container');
            const statusBox = document.getElementById('my-vote-status');
            container.innerHTML = '';
            
            const totalVotes = Object.values(counts).reduce((a, b) => a + b, 0);
            statusBox.innerText = hasVoted ? "✅ 你已完成投票" : "💡 請選擇一個選項進行投票";

            pollOptions.forEach(opt => {
                const count = counts[opt];
                const percent = totalVotes === 0 ? 0 : Math.round((count / totalVotes) * 100);
                const div = document.createElement('div');
                div.className = 'poll-option';
                // 如果已投過票，則禁用點擊，或視需求改為「允許修改投票」
                div.onclick = () => { if(!hasVoted) castVote(opt); else alert("你已經投過票囉！"); };
                div.innerHTML = `
                    <div class="poll-bar" style="width: ${percent}%"></div>
                    <div class="poll-text"><span>${opt}</span> <span>${count} 票 (${percent}%)</span></div>
                `;
                container.appendChild(div);
            });
        }

        function castVote(option) {
            if(confirm(`確定投給「${option}」嗎？投完後不可修改。`)) {
                postData({ type: 'vote_cast', user: currentId, name: currentUser, msg: option });
            }
        }

        function createNewPoll() {
            const title = prompt("投票主題：");
            const opts = prompt("選項 (請用逗號隔開)：");
            if (title && opts) postData({ type: 'vote_setup', user: currentId, name: currentUser, msg: title + '|' + opts.replace(/,/g, '|') });
        }

        function sendChat() {
            const input = document.getElementById('msgInput');
            if (input.value.trim()) { postData({ type: 'chat', user: currentId, name: currentUser, msg: input.value }); input.value = ''; }
        }

        function addNote() {
            const t = prompt("標題："); const c = prompt("內容：");
            if (t && c) postData({ type: 'note', user: currentId, name: currentUser, msg: t + '|' + c });
        }

        function postData(payload) {
            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }).then(() => refreshData());
        }

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('input-bar').style.display = p === 'chat' ? 'flex' : 'none';
            document.getElementById('header-title').innerText = p === 'chat' ? '803 聊天室' : (p === 'notes' ? '重要記事' : '班級投票');
        }
    </script>
</body>
</html>
